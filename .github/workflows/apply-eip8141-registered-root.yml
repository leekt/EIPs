name: Apply EIP-8141 registered root transform

on:
  push:
    branches:
      - agent/tmp-eip-8141-root-registry-build

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply assertion-checked transform
        run: python3 .github/scripts/apply_eip8141_registered_root.py

      - name: Validate patch
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "EIPS/eip-8141.md "
          grep -q 'REGISTERED_STATIC' EIPS/eip-8141.md
          ! grep -q 'EIP8130_ACTOR' EIPS/eip-8141.md

      - name: Commit generated specification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/scripts/apply_eip8141_registered_root.py
          git rm .github/workflows/apply-eip8141-registered-root.yml
          git add EIPS/eip-8141.md
          git commit -m 'docs: define registered-static root key path'
          git push
