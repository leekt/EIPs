name: Link and validate EIP-8141 references

on:
  push:
    branches:
      - agent/tmp-eip-8141-root-registry-build

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link EIP and ERC references
        run: python3 .github/scripts/link_eip8141_references.py

      - name: Validate focused diff
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "EIPS/eip-8141.md "
          grep -q '\[EIP-8130\](./eip-8130.md)' EIPS/eip-8141.md
          grep -q '\[ERC-4337\](./eip-4337.md)' EIPS/eip-8141.md
          ! grep -q 'EIP8130_ACTOR' EIPS/eip-8141.md

      - name: Merge EIP and ERC repositories for validation
        uses: ./.github/actions/merge-repos

      - name: Run EIP validator
        uses: ethereum/eipw-action@b858a0f2687c12af12280aa934c3b842747414fd
        with:
          token: ${{ github.token }}
          unchecked: 1, 5069, 5757
          options-file: config/eipw.toml
          include: EIPS/**

      - name: Commit validated specification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/scripts/link_eip8141_references.py
          git rm .github/workflows/link-and-validate-eip8141.yml
          git add EIPS/eip-8141.md
          git commit -m 'docs: link EIP-8141 references'
          git push
