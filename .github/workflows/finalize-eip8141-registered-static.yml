name: Finalize EIP-8141 registered-static amendment

on:
  push:
    branches:
      - agent/tmp-eip8141-final-spec

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply final wording cleanup
        run: python scripts/finalize_eip8141_registered_static.py

      - name: Commit final EIP content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EIPS/eip-8141.md
          git commit -m "docs: finalize registered-static EIP amendment"
          git push origin "HEAD:${{ github.ref_name }}"
