name: Apply EIP-8141 registered-static VERIFY patch

on:
  push:
    branches:
      - agent/eip-8141-registered-static-verify

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply specification patch
        run: python scripts/apply_eip8141_registered_static.py

      - name: Commit specification update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EIPS/eip-8141.md
          git commit -m "docs: extend registered signatures to smart accounts"
          git push origin "HEAD:${{ github.ref_name }}"
