name: Refine EIP-8141 registered root

on:
  push:
    branches:
      - agent/tmp-eip-8141-root-registry-build

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply assertion-checked refinements
        run: python3 .github/scripts/refine_eip8141_registered_root.py

      - name: Validate specification diff
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "EIPS/eip-8141.md "
          grep -q 'stateful system precompile' EIPS/eip-8141.md
          grep -q 'REGISTERED_STATIC' EIPS/eip-8141.md
          ! grep -q 'EIP8130_ACTOR' EIPS/eip-8141.md
          ! grep -q 'RegisteredK1' EIPS/eip-8141.md

      - name: Commit refined specification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/scripts/refine_eip8141_registered_root.py
          git rm .github/workflows/refine-eip8141-registered-root.yml
          git add EIPS/eip-8141.md
          git commit -m 'docs: refine registered root key semantics'
          git push
