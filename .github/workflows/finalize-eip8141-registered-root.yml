name: Finalize EIP-8141 registered root

on:
  push:
    branches:
      - agent/tmp-eip-8141-root-registry-build

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final assertion-checked corrections
        run: python3 .github/scripts/finalize_eip8141_registered_root.py

      - name: Validate final specification
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "EIPS/eip-8141.md "
          grep -q 'stateful system precompile' EIPS/eip-8141.md
          grep -q 'MUST NOT fall back' EIPS/eip-8141.md
          grep -q 'external sponsor' EIPS/eip-8141.md
          grep -q 'inspired by.*EIP-8130' EIPS/eip-8141.md
          ! grep -q 'EIP8130_ACTOR' EIPS/eip-8141.md
          ! grep -q 'RegisteredK1' EIPS/eip-8141.md

      - name: Commit final specification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/scripts/finalize_eip8141_registered_root.py
          git rm .github/workflows/finalize-eip8141-registered-root.yml
          git add EIPS/eip-8141.md
          git commit -m 'docs: finalize registered root key path'
          git push
